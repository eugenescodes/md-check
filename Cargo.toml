[package]
name = "md-check"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
url = "2.5.8"
walkdir = "2.5.0"
futures = "0.3.32"
anyhow = "1.0.102"
colored = "3.1.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
mockito = "1.7.2"
